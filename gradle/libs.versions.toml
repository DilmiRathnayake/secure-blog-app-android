# Dependency versions chosen to be compatible with
# Android Studio Narwhal 4 Feature Drop (2025.1.4), which supports AGP up to 8.13.
[versions]
agp = "8.13.0"
appcompat = "1.7.1"
material = "1.12.0"
recyclerview = "1.4.0"
constraintlayout = "2.2.1"
activity = "1.10.1"
core = "1.16.0"
exifinterface = "1.4.1"
viewpager2 = "1.1.0"
playServicesAuth = "21.4.0"
junit = "4.13.2"
orgJson = "20240303"
junitExt = "1.2.1"
testRunner = "1.6.2"
espressoCore = "3.6.1"

[libraries]
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
core = { group = "androidx.core", name = "core", version.ref = "core" }
exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
